name: Token Monitor Binaries

# Downstream-only workflow for Javis603/tokscale. Not part of upstream
# junhoyeo/tokscale — kept out of build-native.yml on purpose so syncing
# this fork with upstream never has to resolve a conflict here.
#
# Builds tokscale-cli for the 4 platforms Token Monitor ships, from an
# explicit pinned commit SHA (not whatever "main" currently is), so the
# result is reproducible regardless of how far the fork has since synced.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "tokscale commit SHA to build"
        required: true
        default: "59712ada85640b7aaa00d7da92ed1a15367e961b"

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: "10.13"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            artifact_name: tokscale-darwin-x64
            bin_name: tokscale
            build: cargo build --release -p tokscale-cli --target x86_64-apple-darwin
            strip: strip -x target/x86_64-apple-darwin/release/tokscale
          - host: macos-latest
            target: aarch64-apple-darwin
            artifact_name: tokscale-darwin-arm64
            bin_name: tokscale
            # Deliberately no --features apple-fm: Token Monitor doesn't use
            # the on-device Apple Intelligence summarizer, and skipping it
            # avoids the macos-26/Xcode-26 runner requirement plus the
            # libFoundationModels.dylib sidecar upstream ships alongside it.
            build: cargo build --release -p tokscale-cli --target aarch64-apple-darwin
            strip: strip -x target/aarch64-apple-darwin/release/tokscale
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: tokscale-linux-x64
            bin_name: tokscale
            build: cargo zigbuild --release -p tokscale-cli --target x86_64-unknown-linux-gnu
            strip: strip target/x86_64-unknown-linux-gnu/release/tokscale
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: tokscale-win32-x64
            bin_name: tokscale.exe
            build: cargo build --release -p tokscale-cli --target x86_64-pc-windows-msvc
            strip: ""

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: tm-binaries-${{ matrix.settings.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      - uses: mlugg/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'linux') }}
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'linux') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild

      - name: Build CLI binary
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Strip CLI binary
        if: ${{ matrix.settings.strip != '' }}
        shell: bash
        run: ${{ matrix.settings.strip }}

      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.settings.target }}/release/${{ matrix.settings.bin_name }}" "dist/${{ matrix.settings.bin_name }}"
          ls -la dist

      - name: Upload CLI binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.settings.artifact_name }}
          path: dist
          if-no-files-found: error
          retention-days: 7
